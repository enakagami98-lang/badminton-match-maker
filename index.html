<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Badminton MM">
<meta name="theme-color" content="#2d6a4f">
<title>Badminton Match Maker</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --green-dark: #1b4332;
    --green-main: #2d6a4f;
    --green-mid: #40916c;
    --green-light: #74c69d;
    --green-pale: #d8f3dc;
    --green-court: #e8f5e9;
    --red: #e63946;
    --red-light: #fff0f0;
    --gold: #f4a817;
    --silver: #9e9e9e;
    --bronze: #cd7f32;
    --text: #1a1a2e;
    --text-sub: #555;
    --bg: #f5f7f5;
    --card: #ffffff;
    --radius: 16px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; }

  /* ===== SCREENS ===== */
  .screen { display: none; min-height: 100dvh; flex-direction: column; }
  .screen.active { display: flex; }

  /* ===== SETUP SCREEN ===== */
  #screen-setup {
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    background: linear-gradient(160deg, var(--green-dark) 0%, var(--green-main) 60%, var(--green-mid) 100%);
  }
  .setup-logo { text-align: center; margin-bottom: 36px; }
  .setup-logo .icon { font-size: 56px; margin-bottom: 8px; }
  .setup-logo h1 { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: 2px; }
  .setup-logo p { font-size: 12px; color: rgba(255,255,255,0.7); letter-spacing: 3px; margin-top: 2px; }
  .setup-card {
    background: #fff;
    border-radius: 24px;
    padding: 28px 24px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  }
  .setup-card h2 { font-size: 17px; font-weight: 700; color: var(--green-dark); margin-bottom: 24px; text-align: center; }
  .input-group { margin-bottom: 20px; }
  .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-sub); margin-bottom: 8px; }
  .input-row { display: flex; align-items: center; gap: 12px; }
  .input-row button {
    width: 44px; height: 44px; border: none; border-radius: 50%;
    background: var(--green-pale); color: var(--green-dark);
    font-size: 22px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .input-row button:active { background: var(--green-light); }
  .input-row input {
    flex: 1; text-align: center; font-size: 28px; font-weight: 800;
    border: 2px solid var(--green-pale); border-radius: 12px;
    padding: 8px; color: var(--green-dark); outline: none;
    background: var(--bg);
  }
  .input-row input:focus { border-color: var(--green-mid); }
  .setup-hint { font-size: 12px; color: var(--text-sub); margin-top: 6px; text-align: center; }
  .btn-start {
    width: 100%; padding: 16px;
    background: var(--green-main); color: #fff;
    border: none; border-radius: 14px; font-size: 17px; font-weight: 700;
    cursor: pointer; margin-top: 8px; transition: background 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-start:active { background: var(--green-dark); }

  /* ===== MATCH SCREEN ===== */
  #screen-match { background: var(--bg); }
  .match-header {
    background: #fff;
    padding: 12px 16px 10px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #eee;
    position: sticky; top: 0; z-index: 100;
    box-shadow: var(--shadow);
  }
  .header-logo { display: flex; align-items: center; gap: 8px; }
  .header-logo .logo-icon { font-size: 24px; }
  .header-logo .logo-text { font-size: 13px; font-weight: 800; color: var(--green-dark); line-height: 1.2; }
  .header-logo .logo-sub { font-size: 9px; color: var(--text-sub); letter-spacing: 1px; }
  .header-center { display: flex; align-items: center; gap: 8px; }
  .match-nav-btn {
    width: 28px; height: 28px; border: none; background: var(--green-pale);
    border-radius: 50%; cursor: pointer; font-size: 14px; color: var(--green-dark);
    display: flex; align-items: center; justify-content: center;
  }
  .match-title { font-size: 18px; font-weight: 800; color: var(--green-dark); white-space: nowrap; }
  .header-btns { display: flex; gap: 8px; }
  .btn-adjust {
    padding: 7px 12px; border: 2px solid var(--green-main);
    border-radius: 10px; background: #fff; color: var(--green-main);
    font-size: 12px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; gap: 4px;
    white-space: nowrap;
  }
  .btn-end {
    padding: 7px 12px; border: 2px solid var(--red);
    border-radius: 10px; background: #fff; color: var(--red);
    font-size: 12px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; gap: 4px;
    white-space: nowrap;
  }

  .match-stats {
    margin: 12px 16px 0;
    background: #fff; border-radius: var(--radius);
    padding: 12px 16px;
    display: flex; gap: 0;
    box-shadow: var(--shadow);
  }
  .stat-item { flex: 1; text-align: center; }
  .stat-item + .stat-item { border-left: 1px solid #eee; }
  .stat-icon { font-size: 16px; margin-bottom: 2px; }
  .stat-label { font-size: 10px; color: var(--text-sub); }
  .stat-value { font-size: 22px; font-weight: 800; color: var(--green-dark); }
  .stat-unit { font-size: 12px; color: var(--text-sub); margin-left: 2px; }

  .courts-container { padding: 12px 16px; }
  .courts-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .courts-grid.single { grid-template-columns: 1fr; }

  .court-card {
    background: #fff; border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
    border: 2px solid transparent;
    transition: border-color 0.2s;
  }
  .court-card.decided { border-color: var(--green-light); }
  .court-header {
    background: var(--green-main); color: #fff;
    text-align: center; padding: 7px;
    font-size: 13px; font-weight: 700; letter-spacing: 1px;
  }
  .court-body { padding: 10px; }

  .court-field {
    background: var(--green-court);
    border-radius: 10px;
    padding: 8px;
    position: relative;
  }
  .field-side { text-align: center; }
  .field-side-label { font-size: 10px; color: var(--text-sub); margin-bottom: 6px; font-weight: 600; }
  .field-players { display: flex; gap: 6px; justify-content: center; }
  .player-num {
    width: 44px; height: 44px;
    background: #fff; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 900; color: var(--green-dark);
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    border: 2px solid transparent;
  }
  .player-num.winner { background: var(--green-pale); border-color: var(--green-mid); color: var(--green-dark); }

  .court-net {
    display: flex; align-items: center; gap: 6px;
    margin: 8px 0;
  }
  .net-line { flex: 1; height: 3px; background: repeating-linear-gradient(90deg, #888 0 4px, transparent 4px 8px); border-radius: 2px; }
  .net-post { width: 6px; height: 18px; background: #888; border-radius: 2px; }
  .vs-badge {
    width: 28px; height: 28px; background: var(--green-main); color: #fff;
    border-radius: 50%; font-size: 10px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .court-win-btns { display: flex; gap: 6px; margin-top: 10px; }
  .btn-win {
    flex: 1; padding: 9px 4px;
    border: 2px solid var(--green-light); border-radius: 10px;
    background: #fff; color: var(--green-main);
    font-size: 12px; font-weight: 700; cursor: pointer;
    transition: all 0.15s; text-align: center;
  }
  .btn-win:active { transform: scale(0.97); }
  .btn-win.selected { background: var(--green-main); color: #fff; border-color: var(--green-main); }
  .decided-badge {
    text-align: center; margin-top: 8px;
    font-size: 12px; color: var(--green-mid); font-weight: 600;
  }

  /* Rest section */
  .rest-section {
    margin: 0 16px 12px;
    background: #fff; border-radius: var(--radius);
    padding: 12px 16px; box-shadow: var(--shadow);
  }
  .rest-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .rest-title { font-size: 13px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 6px; }
  .rest-hint { font-size: 10px; color: var(--text-sub); display: flex; align-items: center; gap: 4px; }
  .rest-players { display: flex; flex-wrap: wrap; gap: 8px; }
  .rest-player {
    width: 36px; height: 36px; background: var(--green-pale);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; color: var(--green-dark);
  }
  .rest-empty { font-size: 13px; color: var(--text-sub); }

  /* Ranking section */
  .ranking-section {
    margin: 0 16px 100px;
    background: #fff; border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .ranking-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
  .top3 { display: flex; gap: 10px; margin-bottom: 14px; }
  .top3-item {
    flex: 1; border-radius: 14px; padding: 12px 6px;
    text-align: center;
    border: 2px solid #eee;
  }
  .top3-item.rank1 { border-color: var(--gold); background: #fffbe6; }
  .top3-item.rank2 { border-color: var(--silver); background: #f8f8f8; }
  .top3-item.rank3 { border-color: var(--bronze); background: #fff6ee; }
  .top3-rank { font-size: 10px; font-weight: 700; margin-bottom: 4px; }
  .rank1 .top3-rank { color: var(--gold); }
  .rank2 .top3-rank { color: var(--silver); }
  .rank3 .top3-rank { color: var(--bronze); }
  .top3-crown { font-size: 18px; margin-bottom: 2px; }
  .top3-num { font-size: 28px; font-weight: 900; color: var(--green-dark); }
  .top3-rate { font-size: 11px; font-weight: 700; color: var(--text-sub); margin-top: 2px; }
  .top3-record { font-size: 10px; color: var(--text-sub); }

  .rank-list { border-top: 1px solid #eee; padding-top: 10px; }
  .rank-row {
    display: flex; align-items: center; padding: 6px 0;
    border-bottom: 1px solid #f5f5f5;
    font-size: 13px;
  }
  .rank-pos { width: 36px; color: var(--text-sub); font-size: 12px; }
  .rank-player { width: 36px; font-weight: 800; color: var(--green-dark); font-size: 15px; text-align: center; }
  .rank-rate { flex: 1; color: var(--text-sub); text-align: right; font-size: 12px; }
  .rank-record { width: 90px; color: var(--text-sub); text-align: right; font-size: 12px; }

  /* Bottom nav */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; gap: 10px; padding: 12px 16px;
    background: var(--bg);
    border-top: 1px solid #ddd;
    z-index: 100;
  }
  .btn-prev {
    flex: 1; padding: 14px;
    background: #fff; color: var(--text);
    border: 2px solid #ddd; border-radius: 14px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-next {
    flex: 2; padding: 14px;
    background: var(--green-main); color: #fff;
    border: none; border-radius: 14px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    box-shadow: 0 4px 14px rgba(45,106,79,0.35);
  }
  .btn-next:active { background: var(--green-dark); }

  /* ===== MODAL ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 200;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #fff; border-radius: 24px 24px 0 0;
    width: 100%; max-height: 85dvh; overflow-y: auto;
    padding: 20px 20px 40px;
  }
  .modal-handle { width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 16px; }
  .modal-title { font-size: 17px; font-weight: 800; color: var(--green-dark); margin-bottom: 6px; }
  .modal-subtitle { font-size: 12px; color: var(--text-sub); margin-bottom: 20px; }

  .player-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 24px; }
  .player-chip {
    aspect-ratio: 1; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800;
    cursor: pointer; transition: all 0.15s;
    border: 2px solid var(--green-pale);
    background: var(--green-pale); color: var(--green-dark);
    position: relative;
  }
  .player-chip.inactive {
    background: #f5f5f5; border-color: #ddd; color: #bbb;
    text-decoration: line-through;
  }
  .player-chip .chip-check {
    position: absolute; top: 2px; right: 2px;
    font-size: 9px; color: var(--green-mid);
  }
  .modal-add-section { margin-bottom: 20px; }
  .modal-add-section label { font-size: 13px; font-weight: 600; color: var(--text-sub); display: block; margin-bottom: 8px; }
  .add-player-row { display: flex; gap: 8px; }
  .add-player-row input {
    flex: 1; padding: 10px 14px; border: 2px solid var(--green-pale);
    border-radius: 12px; font-size: 16px; font-weight: 700;
    color: var(--green-dark); outline: none; background: var(--bg);
    text-align: center;
  }
  .add-player-row input:focus { border-color: var(--green-mid); }
  .btn-add-player {
    padding: 10px 18px; background: var(--green-main); color: #fff;
    border: none; border-radius: 12px; font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  .modal-apply {
    width: 100%; padding: 15px;
    background: var(--green-main); color: #fff;
    border: none; border-radius: 14px; font-size: 16px; font-weight: 700;
    cursor: pointer; margin-top: 8px;
  }
  .modal-close {
    width: 100%; padding: 12px;
    background: #f5f5f5; color: var(--text-sub);
    border: none; border-radius: 14px; font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 8px;
  }

  /* ===== HISTORY MODAL ===== */
  .history-round { margin-bottom: 20px; }
  .history-round-title { font-size: 14px; font-weight: 700; color: var(--green-dark); margin-bottom: 8px; border-bottom: 2px solid var(--green-pale); padding-bottom: 4px; }
  .history-court { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .history-court-name { font-size: 11px; font-weight: 700; color: var(--text-sub); margin-bottom: 4px; }
  .history-match { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .history-pair { display: flex; gap: 4px; align-items: center; }
  .history-pnum {
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--green-pale); color: var(--green-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800;
  }
  .history-pnum.win { background: var(--green-main); color: #fff; }
  .history-vs { font-size: 11px; color: var(--text-sub); font-weight: 700; }
  .history-rest { font-size: 12px; color: var(--text-sub); margin-top: 4px; }

  /* ===== FINAL SCREEN ===== */
  #screen-final {
    background: linear-gradient(160deg, var(--green-dark), var(--green-main));
    min-height: 100dvh; padding: 32px 20px 40px;
  }
  .final-header { text-align: center; margin-bottom: 32px; }
  .final-header h1 { font-size: 26px; font-weight: 900; color: #fff; }
  .final-header p { font-size: 14px; color: rgba(255,255,255,0.8); margin-top: 4px; }
  .final-card { background: #fff; border-radius: 20px; padding: 24px; margin-bottom: 16px; }
  .final-top3 { display: flex; gap: 10px; margin-bottom: 20px; }
  .final-top3-item { flex: 1; border-radius: 16px; padding: 16px 8px; text-align: center; border: 2px solid #eee; }
  .final-top3-item.rank1 { border-color: var(--gold); background: #fffbe6; }
  .final-top3-item.rank2 { border-color: var(--silver); background: #f8f8f8; }
  .final-top3-item.rank3 { border-color: var(--bronze); background: #fff6ee; }
  .final-crown { font-size: 24px; }
  .final-rank-label { font-size: 11px; font-weight: 700; margin: 4px 0; }
  .rank1 .final-rank-label { color: var(--gold); }
  .rank2 .final-rank-label { color: var(--silver); }
  .rank3 .final-rank-label { color: var(--bronze); }
  .final-num { font-size: 36px; font-weight: 900; color: var(--green-dark); }
  .final-rate { font-size: 13px; font-weight: 700; color: var(--text-sub); }
  .final-record { font-size: 11px; color: var(--text-sub); }
  .final-all-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
  .final-restart {
    width: 100%; padding: 16px;
    background: var(--green-main); color: #fff;
    border: none; border-radius: 14px; font-size: 16px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }

  /* ===== TOAST ===== */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,0.8); color: #fff;
    padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600;
    opacity: 0; transition: all 0.3s; z-index: 300; white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== ANIMATIONS ===== */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .court-card { animation: fadeIn 0.3s ease both; }
</style>
</head>
<body>

<!-- ===== SETUP SCREEN ===== -->
<div id="screen-setup" class="screen active">
  <div class="setup-logo">
    <div class="icon">🏸</div>
    <h1>BADMINTON</h1>
    <p>MATCH MAKER</p>
  </div>
  <div class="setup-card">
    <h2>試合設定</h2>
    <div class="input-group">
      <label>👥 参加人数</label>
      <div class="input-row">
        <button onclick="adjustSetup('players', -1)">−</button>
        <input type="number" id="input-players" value="12" min="4" max="40" inputmode="numeric">
        <button onclick="adjustSetup('players', 1)">＋</button>
      </div>
      <div class="setup-hint">4〜40名</div>
    </div>
    <div class="input-group">
      <label>🏟 コート数</label>
      <div class="input-row">
        <button onclick="adjustSetup('courts', -1)">−</button>
        <input type="number" id="input-courts" value="3" min="1" max="10" inputmode="numeric">
        <button onclick="adjustSetup('courts', 1)">＋</button>
      </div>
      <div class="setup-hint">1〜10面</div>
    </div>
    <button class="btn-start" onclick="startGame()">🚀 試合開始</button>
  </div>
</div>

<!-- ===== MATCH SCREEN ===== -->
<div id="screen-match" class="screen">
  <div class="match-header">
    <div class="header-logo">
      <div class="logo-icon">🏸</div>
      <div>
        <div class="logo-text">BADMINTON</div>
        <div class="logo-sub">MATCH MAKER</div>
      </div>
    </div>
    <div class="header-center">
      <button class="match-nav-btn" onclick="navigateMatch(-1)">◀</button>
      <div class="match-title" id="match-title">1試合目</div>
      <button class="match-nav-btn" onclick="navigateMatch(1)">▶</button>
    </div>
    <div class="header-btns">
      <button class="btn-adjust" onclick="openAdjust()">👤 人数調整</button>
      <button class="btn-end" onclick="endGame()">⏻ 終了</button>
    </div>
  </div>

  <div class="match-stats" id="match-stats"></div>

  <div class="courts-container">
    <div class="courts-grid" id="courts-grid"></div>
  </div>

  <div class="rest-section" id="rest-section" style="display:none"></div>

  <div class="ranking-section" id="ranking-section"></div>

  <div class="bottom-nav">
    <button class="btn-prev" onclick="openHistory()">📊 前の試合の結果</button>
    <button class="btn-next" onclick="nextMatch()">→ 次の試合へ</button>
  </div>
</div>

<!-- ===== FINAL SCREEN ===== -->
<div id="screen-final" class="screen">
  <div class="final-header">
    <div style="font-size:48px;margin-bottom:8px">🏆</div>
    <h1>最終結果</h1>
    <p id="final-subtitle"></p>
  </div>
  <div class="final-card">
    <div class="final-top3" id="final-top3"></div>
    <div class="final-all-title">🏅 全員ランキング</div>
    <div id="final-all-ranking"></div>
  </div>
  <button class="final-restart" onclick="restartGame()">🔄 最初からやり直す</button>
</div>

<!-- ===== MODALS ===== -->
<div class="modal-overlay" id="modal-adjust">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">👤 人数調整</div>
    <div class="modal-subtitle">タップで参加/不参加を切り替え。＋で新しい番号を追加。</div>
    <div class="player-grid" id="adjust-grid"></div>
    <div class="modal-add-section">
      <label>🏟 コート数（現在 <span id="modal-courts-display"></span>面）</label>
      <div class="input-row">
        <button onclick="adjustModalCourts(-1)">−</button>
        <input type="number" id="modal-courts" value="1" min="1" max="10" inputmode="numeric">
        <button onclick="adjustModalCourts(1)">＋</button>
      </div>
    </div>
    <div class="modal-add-section">
      <label>新しい参加者を追加（番号を自動割り当て）</label>
      <div class="add-player-row">
        <input type="number" id="add-count" value="1" min="1" max="10" inputmode="numeric" placeholder="追加人数">
        <button class="btn-add-player" onclick="addPlayers()">＋追加</button>
      </div>
    </div>
    <button class="modal-apply" onclick="applyAdjust()">✅ この設定で次の試合を組む</button>
    <button class="modal-close" onclick="closeModal('modal-adjust')">キャンセル</button>
  </div>
</div>

<div class="modal-overlay" id="modal-history">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">📊 前の試合の結果</div>
    <div style="margin-bottom:16px;font-size:12px;color:var(--text-sub)">緑の数字が勝ちペア</div>
    <div id="history-content"></div>
    <button class="modal-close" onclick="closeModal('modal-history')">閉じる</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== STATE =====
let state = {
  players: [],          // { id, active }
  courts: 0,
  matchIndex: 0,
  matches: [],          // [{ courts:[{back:[a,b], front:[c,d]}], rest:[], results:[null|'back'|'front'] }]
  wins: {},             // { playerId: wins }
  games: {},            // { playerId: games }
  pairHistory: {},      // "a-b" -> count (ペア履歴)
  opponentHistory: {},  // "a-b" -> count (対戦相手履歴)
  restHistory: [],      // per match: [playerId, ...]
  viewingIndex: 0,
};

function save() {
  try { localStorage.setItem('bm_state', JSON.stringify(state)); } catch(e) {}
}
function load() {
  try {
    const s = localStorage.getItem('bm_state');
    if (s) { state = JSON.parse(s); return true; }
  } catch(e) {}
  return false;
}

// ===== SETUP =====
function adjustSetup(type, delta) {
  const el = document.getElementById('input-' + (type === 'players' ? 'players' : 'courts'));
  let v = parseInt(el.value) || 0;
  if (type === 'players') v = Math.max(4, Math.min(40, v + delta));
  else v = Math.max(1, Math.min(10, v + delta));
  el.value = v;
}

function startGame() {
  const n = parseInt(document.getElementById('input-players').value) || 12;
  const c = parseInt(document.getElementById('input-courts').value) || 3;
  if (n < 4) { showToast('参加者は4名以上必要です'); return; }
  if (c < 1) { showToast('コートは1面以上必要です'); return; }

  state = {
    players: Array.from({length: n}, (_, i) => ({ id: i + 1, active: true })),
    courts: c,
    matchIndex: 0,
    matches: [],
    wins: {},
    games: {},
    pairHistory: {},
    opponentHistory: {},
    lastPlayedMatchIndex: {}, // 各プレイヤーが最後に出た試合番号
    restHistory: [],
    viewingIndex: 0,
  };
  for (let i = 1; i <= n; i++) { state.wins[i] = 0; state.games[i] = 0; state.lastPlayedMatchIndex[i] = -1; }

  generateNextMatch();
  save();
  showScreen('match');
  renderMatch();
}

// ===== MATCH GENERATION =====
function getActivePlayers() {
  return state.players.filter(p => p.active).map(p => p.id);
}

function generateNextMatch() {
  const active = getActivePlayers();
  const maxCourts = Math.min(state.courts, Math.floor(active.length / 4));
  const playing = maxCourts * 4;
  const restCount = active.length - playing;

  // Decide who rests
  let rest = [];
  if (restCount > 0) {
    // 1コート・8人以上 → 直前に出た人を強制休みにする厳格モード
    if (maxCourts === 1 && active.length >= 8) {
      rest = selectRestOneCourt(active, restCount);
    } else {
      // 複数コート → 従来ロジック（連続休みを避ける）
      const lastRest = state.restHistory.length > 0 ? state.restHistory[state.restHistory.length - 1] : [];
      const notLastRest = active.filter(p => !lastRest.includes(p));
      const candidates = notLastRest.length >= restCount ? notLastRest : active;
      rest = shuffle([...candidates]).slice(0, restCount);
    }
  }
  state.restHistory.push(rest);

  const playingPlayers = active.filter(p => !rest.includes(p));
  const shuffled = shuffle([...playingPlayers]);

  // Assign to courts trying to avoid repeated pairs
  const courtAssignments = assignCourts(shuffled, maxCourts);

  const match = {
    courts: courtAssignments,
    rest: rest,
    results: Array(maxCourts).fill(null),
  };
  state.matches.push(match);
  state.matchIndex = state.matches.length - 1;
  state.viewingIndex = state.matchIndex;
}

function assignCourts(players, numCourts) {
  let best = null;
  let bestScore = Infinity;

  for (let attempt = 0; attempt < 300; attempt++) {
    const arr = shuffle([...players]);
    let score = 0;
    const courts = [];
    for (let i = 0; i < numCourts; i++) {
      const back  = [arr[i*4],   arr[i*4+1]];
      const front = [arr[i*4+2], arr[i*4+3]];
      const group4 = [arr[i*4], arr[i*4+1], arr[i*4+2], arr[i*4+3]];

      // ペア重複ペナルティ
      score += getPairScore(back[0], back[1]) + getPairScore(front[0], front[1]);
      // 同じ4人が同コートに連続で入るペナルティ（最重要）
      score += getGroupScore(group4) * 20;
      // 対戦相手重複ペナルティ
      score += getOpponentScore(back, front);

      courts.push({ back, front });
    }
    if (score < bestScore) {
      bestScore = score;
      best = courts;
    }
    if (score === 0) break;
  }
  return best;
}

// 同じ4人組が直近2試合で同コートにいたか
function getGroupScore(group4) {
  if (state.matches.length === 0) return 0;
  const sorted = [...group4].sort((a,b) => a-b).join('-');
  let score = 0;
  const checkCount = Math.min(2, state.matches.length);
  for (let i = 0; i < checkCount; i++) {
    const match = state.matches[state.matches.length - 1 - i];
    for (const court of match.courts) {
      const g = [...court.back, ...court.front].sort((a,b) => a-b).join('-');
      if (g === sorted) score += (i === 0) ? 1 : 0.3;
    }
  }
  return score;
}

function getPairScore(a, b) {
  const key = [a, b].sort((x, y) => x - y).join('-');
  return state.pairHistory[key] || 0;
}

// 対戦相手（ネット越し）の重複スコア
function getOpponentScore(back, front) {
  let score = 0;
  back.forEach(a => front.forEach(b => {
    const key = [a,b].sort((x,y)=>x-y).join('-');
    score += (state.opponentHistory[key] || 0) * 0.5;
  }));
  return score;
}

// ===== 1コート厳格休み選択 =====
// 直前に出た人を強制休みにし、連続出場を防ぐ
function selectRestOneCourt(active, restCount) {
  if (state.matches.length === 0) {
    // 初戦: 休み履歴なし → シャッフルで選ぶ
    return shuffle([...active]).slice(0, restCount);
  }

  const lastMatch = state.matches[state.matches.length - 1];
  // 直前の試合に出た全プレイヤー
  const lastPlayed = [...new Set(lastMatch.courts.flatMap(c => [...c.back, ...c.front]))]
    .filter(p => active.includes(p));
  const canPlay = active.filter(p => !lastPlayed.includes(p));

  if (canPlay.length >= 4) {
    // ===== 厳格モード: lastPlayedは全員休み =====
    const extraNeeded = restCount - lastPlayed.length;
    let extra = [];
    if (extraNeeded > 0) {
      // canPlayの中から追加で休む人を選ぶ（前回休んだ人は除外優先）
      const lastRested = state.restHistory.length > 0 ? state.restHistory[state.restHistory.length - 1] : [];
      const notRestedLast = canPlay.filter(p => !lastRested.includes(p));
      const restedLast    = canPlay.filter(p =>  lastRested.includes(p));
      if (notRestedLast.length >= extraNeeded) {
        extra = shuffle([...notRestedLast]).slice(0, extraNeeded);
      } else {
        extra = [...notRestedLast, ...shuffle([...restedLast]).slice(0, extraNeeded - notRestedLast.length)];
      }
    } else if (extraNeeded < 0) {
      // lastPlayedが多すぎる（複数コートから1コートへの移行時など）
      // 最近出た順に多く休ませる
      const sorted = [...lastPlayed].sort((a, b) =>
        (state.lastPlayedMatchIndex[b] ?? -1) - (state.lastPlayedMatchIndex[a] ?? -1)
      );
      return sorted.slice(0, restCount);
    }
    return [...lastPlayed, ...extra];
  } else {
    // ===== フォールバック: 人が足りず完全回避不可 =====
    // canPlay全員を出場させ、lastPlayedから「最も長く休んでいた人」を優先して出場
    const forcedPlay = 4 - canPlay.length;
    const sortedLastPlayed = [...lastPlayed].sort((a, b) =>
      (state.lastPlayedMatchIndex[a] ?? -1) - (state.lastPlayedMatchIndex[b] ?? -1) // 長く休んだ順
    );
    const forcedToPlay = sortedLastPlayed.slice(0, forcedPlay);
    const mustRest     = sortedLastPlayed.slice(forcedPlay);
    const needFromCanPlay = restCount - mustRest.length;
    const extraRest = needFromCanPlay > 0 ? shuffle([...canPlay]).slice(0, needFromCanPlay) : [];
    return [...mustRest, ...extraRest];
  }
}

// ペア・対戦相手の履歴を記録
function recordMatchHistory(courts) {
  const matchIdx = state.matchIndex;
  if (!state.lastPlayedMatchIndex) state.lastPlayedMatchIndex = {};
  courts.forEach(c => {
    incPair(c.back[0], c.back[1]);
    incPair(c.front[0], c.front[1]);
    // 出場記録を更新
    [...c.back, ...c.front].forEach(p => {
      state.lastPlayedMatchIndex[p] = matchIdx;
    });
    c.back.forEach(a => c.front.forEach(b => {
      const key = [a,b].sort((x,y)=>x-y).join('-');
      state.opponentHistory[key] = (state.opponentHistory[key] || 0) + 1;
    }));
  });
}

function incPair(a, b) {
  const key = [a, b].sort((x, y) => x - y).join('-');
  state.pairHistory[key] = (state.pairHistory[key] || 0) + 1;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ===== RENDER =====
function renderMatch() {
  const match = state.matches[state.viewingIndex];
  if (!match) return;

  const isLatest = state.viewingIndex === state.matchIndex;
  document.getElementById('match-title').textContent = `${state.viewingIndex + 1}試合目`;

  // Stats
  const active = getActivePlayers();
  const restCount = match.rest.length;
  const statsEl = document.getElementById('match-stats');
  statsEl.innerHTML = `
    <div class="stat-item">
      <div class="stat-icon">👥</div>
      <div class="stat-label">参加人数</div>
      <div><span class="stat-value">${state.players.filter(p=>p.active).length}</span><span class="stat-unit">名</span></div>
    </div>
    <div class="stat-item">
      <div class="stat-icon">🏟</div>
      <div class="stat-label">コート数</div>
      <div><span class="stat-value">${match.courts.length}</span><span class="stat-unit">面</span></div>
    </div>
    <div class="stat-item">
      <div class="stat-icon">☕</div>
      <div class="stat-label">休み</div>
      <div><span class="stat-value">${restCount}</span><span class="stat-unit">名</span></div>
    </div>
  `;

  // Courts
  const grid = document.getElementById('courts-grid');
  grid.innerHTML = '';
  grid.className = 'courts-grid' + (match.courts.length === 1 ? ' single' : '');

  match.courts.forEach((court, i) => {
    const result = match.results[i];
    const decided = result !== null;
    const div = document.createElement('div');
    div.className = 'court-card' + (decided ? ' decided' : '');
    div.style.animationDelay = (i * 0.05) + 's';

    const backWin = result === 'back';
    const frontWin = result === 'front';

    div.innerHTML = `
      <div class="court-header">コート ${i + 1}</div>
      <div class="court-body">
        <div class="court-field">
          <div class="field-side">
            <div class="field-side-label">奥側ペア</div>
            <div class="field-players">
              <div class="player-num ${backWin ? 'winner' : ''}">${court.back[0]}</div>
              <div class="player-num ${backWin ? 'winner' : ''}">${court.back[1]}</div>
            </div>
          </div>
          <div class="court-net">
            <div class="net-post"></div>
            <div class="net-line"></div>
            <div class="vs-badge">VS</div>
            <div class="net-line"></div>
            <div class="net-post"></div>
          </div>
          <div class="field-side">
            <div class="field-side-label">手前ペア</div>
            <div class="field-players">
              <div class="player-num ${frontWin ? 'winner' : ''}">${court.front[0]}</div>
              <div class="player-num ${frontWin ? 'winner' : ''}">${court.front[1]}</div>
            </div>
          </div>
        </div>
        ${isLatest ? `
        <div class="court-win-btns">
          <button class="btn-win ${backWin ? 'selected' : ''}" onclick="recordWin(${i}, 'back')">奥側ペアが勝ち</button>
          <button class="btn-win ${frontWin ? 'selected' : ''}" onclick="recordWin(${i}, 'front')">手前ペアが勝ち</button>
        </div>
        ${decided ? '<div class="decided-badge">✅ 結果登録済み</div>' : '<div style="text-align:center;margin-top:6px;font-size:11px;color:#bbb">勝ったペアを選択</div>'}
        ` : `
        ${decided ? '<div class="decided-badge">✅ ' + (backWin ? '奥側ペアが勝ち' : '手前ペアが勝ち') + '</div>' : '<div style="text-align:center;margin-top:8px;font-size:11px;color:#bbb">未登録</div>'}
        `}
      </div>
    `;
    grid.appendChild(div);
  });

  // Rest
  const restEl = document.getElementById('rest-section');
  if (match.rest.length > 0) {
    restEl.style.display = 'block';
    restEl.innerHTML = `
      <div class="rest-header">
        <div class="rest-title">☕ 今回の休み（${match.rest.length}名）</div>
        <div class="rest-hint">🔄 休む人は毎回変わるように自動調整されます</div>
      </div>
      <div class="rest-players">
        ${match.rest.map(p => `<div class="rest-player">${p}</div>`).join('')}
      </div>
    `;
  } else {
    restEl.style.display = 'none';
  }

  // Ranking
  renderRanking();
}

function renderRanking() {
  const el = document.getElementById('ranking-section');
  const ranked = getRanked();
  const top3 = ranked.slice(0, 3);
  const rest = ranked.slice(3);

  const crowns = ['👑', '🥈', '🥉'];
  const rankClass = ['rank1', 'rank2', 'rank3'];
  const rankLabel = ['1位', '2位', '3位'];

  let top3HTML = top3.map((p, i) => `
    <div class="top3-item ${rankClass[i]}">
      <div class="top3-crown">${crowns[i]}</div>
      <div class="top3-rank">${rankLabel[i]}</div>
      <div class="top3-num">${p.id}</div>
      <div class="top3-rate">勝率 ${p.rate.toFixed(3)}</div>
      <div class="top3-record">${p.wins}勝 / ${p.losses}敗</div>
    </div>
  `).join('');

  let listHTML = rest.map((p, i) => `
    <div class="rank-row">
      <div class="rank-pos">${i + 4}位</div>
      <div class="rank-player">${p.id}</div>
      <div class="rank-rate">勝率 ${p.rate.toFixed(3)}</div>
      <div class="rank-record">${p.wins}勝 / ${p.losses}敗</div>
    </div>
  `).join('');

  el.innerHTML = `
    <div class="ranking-title">🏆 個人勝率ランキング</div>
    ${top3.length > 0 ? `<div class="top3">${top3HTML}</div>` : ''}
    ${rest.length > 0 ? `<div class="rank-list">${listHTML}</div>` : ''}
    ${ranked.length === 0 ? '<div style="text-align:center;color:var(--text-sub);font-size:14px;padding:20px 0">まだ結果がありません</div>' : ''}
  `;
}

function getRanked() {
  return state.players
    .filter(p => p.active || state.games[p.id] > 0)
    .map(p => {
      const wins = state.wins[p.id] || 0;
      const games = state.games[p.id] || 0;
      const losses = games - wins;
      const rate = games > 0 ? wins / games : 0;
      return { id: p.id, wins, losses, games, rate };
    })
    .filter(p => p.games > 0)
    .sort((a, b) => {
      if (b.rate !== a.rate) return b.rate - a.rate;
      if (b.wins !== a.wins) return b.wins - a.wins;
      return a.id - b.id;
    });
}

// ===== ACTIONS =====
function recordWin(courtIndex, side) {
  if (state.viewingIndex !== state.matchIndex) return;
  const match = state.matches[state.matchIndex];
  const prev = match.results[courtIndex];

  // Undo previous
  if (prev !== null) {
    const court = match.courts[courtIndex];
    const prevWinners = prev === 'back' ? court.back : court.front;
    const prevLosers = prev === 'back' ? court.front : court.back;
    prevWinners.forEach(p => { state.wins[p]--; state.games[p]--; });
    prevLosers.forEach(p => { state.games[p]--; });
  }

  // Record new
  match.results[courtIndex] = side;
  const court = match.courts[courtIndex];
  const winners = side === 'back' ? court.back : court.front;
  const losers = side === 'back' ? court.front : court.back;
  winners.forEach(p => { state.wins[p] = (state.wins[p] || 0) + 1; state.games[p] = (state.games[p] || 0) + 1; });
  losers.forEach(p => { state.games[p] = (state.games[p] || 0) + 1; });

  save();
  renderMatch();
}

function nextMatch() {
  // If viewing older match, just go to latest
  if (state.viewingIndex < state.matchIndex) {
    state.viewingIndex = state.matchIndex;
    renderMatch();
    return;
  }

  const match = state.matches[state.matchIndex];
  // Check if all results entered
  const unresolved = match.results.filter(r => r === null).length;
  if (unresolved > 0) {
    showToast(`まだ ${unresolved} コートの結果が未登録です`);
  }

  // Record pairs before generating new match
  recordMatchHistory(match.courts);

  generateNextMatch();
  save();
  renderMatch();

  // Scroll to top
  document.querySelector('.courts-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function navigateMatch(delta) {
  const newIndex = state.viewingIndex + delta;
  if (newIndex < 0 || newIndex >= state.matches.length) return;
  state.viewingIndex = newIndex;
  renderMatch();
}

function endGame() {
  if (!confirm('試合を終了して最終結果を表示しますか？')) return;
  showFinal();
}

// ===== ADJUST =====
function openAdjust() {
  const grid = document.getElementById('adjust-grid');
  grid.innerHTML = '';
  state.players.forEach(p => {
    const div = document.createElement('div');
    div.className = 'player-chip' + (p.active ? '' : ' inactive');
    div.dataset.id = p.id;
    div.innerHTML = p.id + (p.active ? '<span class="chip-check">✓</span>' : '');
    div.onclick = () => {
      div.classList.toggle('inactive');
      div.innerHTML = p.id + (div.classList.contains('inactive') ? '' : '<span class="chip-check">✓</span>');
    };
    grid.appendChild(div);
  });
  // コート数を現在値にセット
  document.getElementById('modal-courts').value = state.courts;
  document.getElementById('modal-courts-display').textContent = state.courts;
  openModal('modal-adjust');
}

function adjustModalCourts(delta) {
  const el = document.getElementById('modal-courts');
  let v = parseInt(el.value) || 1;
  v = Math.max(1, Math.min(10, v + delta));
  el.value = v;
}

function addPlayers() {
  const count = parseInt(document.getElementById('add-count').value) || 1;
  const maxId = state.players.reduce((m, p) => Math.max(m, p.id), 0);
  for (let i = 0; i < count; i++) {
    const newId = maxId + i + 1;
    state.players.push({ id: newId, active: true });
    state.wins[newId] = 0;
    state.games[newId] = 0;
    state.lastPlayedMatchIndex[newId] = -1;
  }
  openAdjust(); // refresh grid
}

function applyAdjust() {
  const chips = document.querySelectorAll('#adjust-grid .player-chip');
  chips.forEach(chip => {
    const id = parseInt(chip.dataset.id);
    const p = state.players.find(x => x.id === id);
    if (p) p.active = !chip.classList.contains('inactive');
  });

  const active = getActivePlayers();
  if (active.length < 4) {
    showToast('参加者は4名以上必要です');
    return;
  }

  // コート数を更新
  const newCourts = parseInt(document.getElementById('modal-courts').value) || state.courts;
  state.courts = Math.max(1, Math.min(10, newCourts));

  closeModal('modal-adjust');

  // Generate new match with updated players
  recordPairs(state.matches[state.matchIndex].courts);
  generateNextMatch();
  save();
  renderMatch();
  showToast('人数を更新して次の試合を組みました');
}

// ===== HISTORY =====
function openHistory() {
  const el = document.getElementById('history-content');
  if (state.matches.length === 0) {
    el.innerHTML = '<div style="text-align:center;color:var(--text-sub);padding:20px">まだ試合がありません</div>';
    openModal('modal-history');
    return;
  }

  const prev = state.matches.slice(0, state.viewingIndex);
  if (prev.length === 0) {
    el.innerHTML = '<div style="text-align:center;color:var(--text-sub);padding:20px">前の試合はありません</div>';
    openModal('modal-history');
    return;
  }

  el.innerHTML = prev.slice().reverse().map((match, revIdx) => {
    const idx = prev.length - 1 - revIdx;
    const courtHTML = match.courts.map((court, ci) => {
      const result = match.results[ci];
      const backWin = result === 'back';
      const frontWin = result === 'front';
      return `
        <div class="history-court">
          <div class="history-court-name">コート ${ci + 1}</div>
          <div class="history-match">
            <div class="history-pair">
              <div class="history-pnum ${backWin ? 'win' : ''}">${court.back[0]}</div>
              <div class="history-pnum ${backWin ? 'win' : ''}">${court.back[1]}</div>
            </div>
            <div class="history-vs">VS</div>
            <div class="history-pair">
              <div class="history-pnum ${frontWin ? 'win' : ''}">${court.front[0]}</div>
              <div class="history-pnum ${frontWin ? 'win' : ''}">${court.front[1]}</div>
            </div>
            ${result === null ? '<span style="font-size:11px;color:#bbb;margin-left:8px">未登録</span>' : ''}
          </div>
        </div>
      `;
    }).join('');
    const restHTML = match.rest.length > 0
      ? `<div class="history-rest">☕ 休み：${match.rest.join('、')}</div>`
      : '';
    return `
      <div class="history-round">
        <div class="history-round-title">${idx + 1}試合目</div>
        ${courtHTML}
        ${restHTML}
      </div>
    `;
  }).join('');

  openModal('modal-history');
}

// ===== FINAL =====
function showFinal() {
  const ranked = getRanked();
  const top3 = ranked.slice(0, 3);
  const rest = ranked.slice(3);
  const totalMatches = state.matches.length;

  document.getElementById('final-subtitle').textContent = `全${totalMatches}試合 完了`;

  const crowns = ['👑', '🥈', '🥉'];
  const rankClass = ['rank1', 'rank2', 'rank3'];
  const rankLabel = ['1位', '2位', '3位'];

  document.getElementById('final-top3').innerHTML = top3.map((p, i) => `
    <div class="final-top3-item ${rankClass[i]}">
      <div class="final-crown">${crowns[i]}</div>
      <div class="final-rank-label">${rankLabel[i]}</div>
      <div class="final-num">${p.id}</div>
      <div class="final-rate">勝率 ${p.rate.toFixed(3)}</div>
      <div class="final-record">${p.wins}勝 / ${p.losses}敗</div>
    </div>
  `).join('');

  document.getElementById('final-all-ranking').innerHTML = `
    <div class="rank-list">
      ${rest.map((p, i) => `
        <div class="rank-row">
          <div class="rank-pos">${i + 4}位</div>
          <div class="rank-player">${p.id}</div>
          <div class="rank-rate">勝率 ${p.rate.toFixed(3)}</div>
          <div class="rank-record">${p.wins}勝 / ${p.losses}敗</div>
        </div>
      `).join('')}
      ${ranked.length === 0 ? '<div style="text-align:center;color:var(--text-sub);padding:20px">データなし</div>' : ''}
    </div>
  `;

  showScreen('final');
}

function restartGame() {
  if (!confirm('データを消去して最初からやり直しますか？')) return;
  localStorage.removeItem('bm_state');
  showScreen('setup');
}

// ===== UTILS =====
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}

function openModal(id) {
  document.getElementById(id).classList.add('active');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== INIT =====
window.addEventListener('load', () => {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
  if (load() && state.matches.length > 0) {
    state.viewingIndex = state.matchIndex;
    showScreen('match');
    renderMatch();
  }
});
</script>
