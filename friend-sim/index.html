<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>それでも友達 〜面会室より〜</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic',Meiryo,sans-serif;
    background:#1a1d2b; color:#2b2b33;
    display:flex; justify-content:center;
  }
  #app { width:100%; max-width:560px; min-height:100vh; background:#f4f1ea; position:relative; overflow:hidden; }
  .screen { display:none; }
  .screen.active { display:block; }
  button { font-family:inherit; cursor:pointer; }

  /* ===== セットアップ画面 ===== */
  #setup { padding:18px 16px 40px; }
  .title { text-align:center; margin:6px 0 2px; font-size:26px; font-weight:800; color:#3a3f5c; letter-spacing:2px; }
  .subtitle { text-align:center; font-size:12px; color:#8a8fa8; margin-bottom:14px; }
  .card { background:#fff; border-radius:14px; padding:14px; margin-bottom:14px; box-shadow:0 2px 8px rgba(60,60,90,.08); }
  .card h2 { font-size:14px; color:#5a5f7c; margin-bottom:10px; border-left:4px solid #7c88d8; padding-left:8px; }
  .row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .row label { width:84px; font-size:13px; color:#666; flex-shrink:0; }
  .row input[type=text], .row select {
    flex:1; padding:8px 10px; border:1.5px solid #d8d5cc; border-radius:8px; font-size:15px; background:#fbfaf7; min-width:0;
  }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { border:1.5px solid #c8cbe0; background:#f2f3fa; color:#4a4f70; border-radius:999px; padding:5px 12px; font-size:13px; }
  .chip.sel { background:#7c88d8; border-color:#7c88d8; color:#fff; }
  #facePreviewWrap { display:flex; justify-content:center; margin-bottom:10px; }
  #facePreview { width:180px; height:200px; background:linear-gradient(#e8ecf8,#f6f4ee); border-radius:12px; border:1.5px solid #dcdaf0; }
  .partRow { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .partRow .pname { width:64px; font-size:12px; color:#666; flex-shrink:0; }
  .partRow .pval { flex:1; text-align:center; font-size:13px; color:#3a3f5c; background:#f4f3ee; border-radius:6px; padding:5px 0; }
  .arrowBtn { width:36px; height:30px; border:none; border-radius:8px; background:#7c88d8; color:#fff; font-size:14px; font-weight:700; }
  .arrowBtn:active { background:#5f6cc4; }
  .swatches { display:flex; gap:6px; flex:1; flex-wrap:wrap; }
  .sw { width:26px; height:26px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1.5px #ccc; }
  .sw.sel { box-shadow:0 0 0 2.5px #7c88d8; }
  .randomBtn { display:block; margin:8px auto 0; background:#f0b429; border:none; color:#5c4400; font-weight:700; padding:8px 20px; border-radius:999px; font-size:13px; }
  #startBtn { display:block; width:100%; padding:15px; font-size:18px; font-weight:800; color:#fff;
    background:linear-gradient(#8a95e8,#6a76d4); border:none; border-radius:14px; box-shadow:0 4px 0 #4c58b0; letter-spacing:3px; }
  #startBtn:active { transform:translateY(3px); box-shadow:0 1px 0 #4c58b0; }
  .hint { font-size:11.5px; color:#9a97a8; line-height:1.7; margin-top:10px; }

  /* ===== ゲーム画面 ===== */
  #game { height:100vh; height:100dvh; display:none; flex-direction:column; }
  #game.active { display:flex; }
  #hud { padding:8px 12px 6px; background:#2f3350; color:#fff; flex-shrink:0; }
  #hudTop { display:flex; justify-content:space-between; align-items:center; font-size:13px; margin-bottom:6px; }
  #phaseLabel { font-weight:700; color:#ffd97a; }
  #turnLabel { color:#c8ccec; }
  .meters { display:flex; gap:8px; }
  .meter { flex:1; position:relative; }
  .meter .mlabel { font-size:10.5px; color:#c8ccec; display:flex; justify-content:space-between; }
  .meter .bar { height:9px; background:#1c1e33; border-radius:5px; overflow:hidden; margin-top:2px; }
  .meter .fill { height:100%; border-radius:5px; transition:width .6s ease; }
  #fillF .fill { background:linear-gradient(90deg,#ff8fa8,#ff5f82); }
  #fillR .fill { background:linear-gradient(90deg,#7ddc9a,#3cb96a); }
  #fillS .fill { background:linear-gradient(90deg,#ffd36a,#ffb02e); }
  .deltaChip { position:absolute; right:0; top:-16px; font-size:11px; font-weight:800; padding:1px 6px; border-radius:8px;
    opacity:0; animation:pop 1.4s ease forwards; pointer-events:none; white-space:nowrap; }
  .deltaChip.up { background:#3cb96a; color:#fff; } .deltaChip.down { background:#e05a6a; color:#fff; }
  @keyframes pop { 0%{opacity:0; transform:translateY(6px);} 15%{opacity:1; transform:translateY(0);} 75%{opacity:1;} 100%{opacity:0; transform:translateY(-8px);} }

  #stage { flex:1; position:relative; overflow:hidden; min-height:220px; }
  .scene { position:absolute; inset:0; transition:opacity .8s; }
  #sceneJail { background:linear-gradient(#9aa2b8 0%,#b8becc 55%,#8e94a8 55.5%,#a8adbd 100%); }
  #sceneJail::before { content:''; position:absolute; left:0; right:0; top:55%; height:10px; background:#767c92; }
  #sceneJail .window { position:absolute; top:18px; right:26px; width:64px; height:52px; background:linear-gradient(#dfe6f4,#c2ccdf); border:4px solid #767c92; border-radius:4px; }
  #sceneJail .window::before { content:''; position:absolute; inset:0; background:
    linear-gradient(90deg,transparent 46%,#767c92 46%,#767c92 54%,transparent 54%),
    linear-gradient(transparent 46%,#767c92 46%,#767c92 54%,transparent 54%); }
  #sceneOut { background:linear-gradient(#8ec9f0 0%,#c9e6f8 52%,#9fd48a 52.5%,#b8e0a0 100%); opacity:0; }
  #sceneOut .sun { position:absolute; top:20px; right:30px; width:52px; height:52px; border-radius:50%; background:#ffe27a; box-shadow:0 0 30px 10px rgba(255,226,122,.6); }
  #charWrap { position:absolute; left:50%; bottom:-12px; transform:translateX(-50%); width:270px; }
  #charWrap svg { width:100%; display:block; filter:drop-shadow(0 3px 5px rgba(40,40,70,.25)); }
  #acryl { position:absolute; inset:0; pointer-events:none; transition:opacity .8s;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 38%,rgba(255,255,255,.05) 46%,transparent 55%,rgba(255,255,255,.14) 78%,transparent 86%); }
  #acryl::after { content:''; position:absolute; left:50%; transform:translateX(-50%); bottom:26%; width:120px; height:14px;
    background:radial-gradient(circle 4px at 10px 7px,#5c6178 98%,transparent) 0 0/24px 14px repeat-x; opacity:.55; }

  #dialogueArea { flex-shrink:0; background:#2f3350; padding:10px 12px 14px; min-height:186px; display:flex; flex-direction:column; }
  #dbox { background:rgba(252,251,246,.97); border-radius:12px; padding:12px 14px 14px; position:relative; min-height:92px; flex-shrink:0; cursor:pointer; }
  #dname { position:absolute; top:-12px; left:12px; background:#7c88d8; color:#fff; font-size:12px; font-weight:700; padding:3px 14px; border-radius:999px; }
  #dname.you { background:#e8975a; }
  #dname.hidden { display:none; }
  #dtext { font-size:15px; line-height:1.75; color:#33323d; white-space:pre-wrap; }
  #dtext.narr { color:#6a7090; font-style:italic; text-align:center; padding-top:8px; }
  #dnext { position:absolute; right:12px; bottom:6px; color:#7c88d8; font-size:14px; animation:bob 1s infinite; display:none; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(4px);} }
  #choices { margin-top:10px; display:flex; flex-direction:column; gap:7px; }
  .choiceBtn { text-align:left; background:#fdfcf8; border:1.5px solid #b8bee4; border-radius:10px; padding:10px 12px;
    font-size:14px; line-height:1.5; color:#3a3f5c; box-shadow:0 2px 0 #b8bee4;
    opacity:0; transform:translateY(6px); animation:cin .3s ease forwards; }
  .choiceBtn:active { background:#e8ebfa; transform:translateY(2px); box-shadow:none; }
  .choiceBtn b { color:#6a76d4; margin-right:6px; }
  @keyframes cin { to { opacity:1; transform:translateY(0);} }

  /* ===== エンディング画面 ===== */
  #ending { padding:24px 18px 40px; text-align:center; min-height:100vh;
    background:linear-gradient(#2f3350,#4a4f78); color:#f0eee6; }
  #endBadge { display:inline-block; font-size:13px; font-weight:800; letter-spacing:2px; padding:4px 18px; border-radius:999px; background:#ffd97a; color:#5c4400; margin-bottom:10px; }
  #endTitle { font-size:24px; font-weight:800; margin-bottom:14px; letter-spacing:1px; }
  #endFace { width:210px; height:230px; margin:0 auto 12px; background:rgba(255,255,255,.1); border-radius:16px; }
  #endBody { font-size:14.5px; line-height:2; margin:0 auto 18px; max-width:420px; text-align:left; white-space:pre-wrap; background:rgba(0,0,0,.18); padding:14px 16px; border-radius:12px; }
  #endStats { display:flex; gap:10px; justify-content:center; margin-bottom:22px; font-size:13px; }
  #endStats span { background:rgba(255,255,255,.12); padding:6px 12px; border-radius:8px; }
  .endBtn { display:block; width:80%; margin:0 auto 10px; padding:13px; font-size:15px; font-weight:700; border:none; border-radius:12px; }
  #retryBtn { background:#8a95e8; color:#fff; box-shadow:0 3px 0 #5560b8; }
  #resetBtn { background:transparent; color:#c8ccec; border:1.5px solid #8a8fb8; }
</style>
</head>
<body>
<div id="app">

  <!-- ========== 設定画面 ========== -->
  <div id="setup" class="screen active">
    <h1 class="title">それでも友達</h1>
    <div class="subtitle">〜 面会室より 〜　友情・反省・元気のバランス面会シミュレーション</div>

    <div class="card">
      <h2>1. 事件のあらすじ</h2>
      <div class="row"><label>友達の名前</label><input type="text" id="inName" maxlength="10" placeholder="例：タカシ"></div>
      <div class="row"><label>一人称</label>
        <select id="inPronoun"><option>僕</option><option>俺</option><option>私</option><option>うち</option></select>
      </div>
      <div class="row"><label>あなたの呼び名</label><input type="text" id="inPlayer" maxlength="10" placeholder="例：ケン（空欄なら「キミ」）"></div>
      <div class="row"><label>犯した罪</label><input type="text" id="inCrime" maxlength="20" placeholder="自由に入力できます"></div>
      <div class="chips" id="crimeChips"></div>
    </div>

    <div class="card">
      <h2>2. 友達の顔をつくる</h2>
      <div id="facePreviewWrap"><div id="facePreview"></div></div>
      <div id="partRows"></div>
      <button class="randomBtn" id="randomFace">🎲 おまかせ</button>
    </div>

    <button id="startBtn">面会に行く</button>
    <p class="hint">💡 遊びかた：捕まった友達と10回の面会をします。<b>励ますだけ</b>では反省せず、<b>叱ってばかり</b>だと心が折れ、<b>突き放す</b>と友情が壊れます。3つのゲージのバランスを取りながら、友達を立ち直らせましょう。<br>
    ※会話と選択肢は、友達の状態に合わせてページ内の会話エンジンが自動生成します（通信・APIキー不要）。</p>
  </div>

  <!-- ========== ゲーム画面 ========== -->
  <div id="game" class="screen">
    <div id="hud">
      <div id="hudTop"><span id="phaseLabel"></span><span id="turnLabel"></span></div>
      <div class="meters">
        <div class="meter" id="fillF"><div class="mlabel"><span>💗 友情</span><span class="mval"></span></div><div class="bar"><div class="fill"></div></div></div>
        <div class="meter" id="fillR"><div class="mlabel"><span>🌱 反省</span><span class="mval"></span></div><div class="bar"><div class="fill"></div></div></div>
        <div class="meter" id="fillS"><div class="mlabel"><span>☀️ 元気</span><span class="mval"></span></div><div class="bar"><div class="fill"></div></div></div>
      </div>
    </div>
    <div id="stage">
      <div class="scene" id="sceneJail"><div class="window"></div></div>
      <div class="scene" id="sceneOut"><div class="sun"></div></div>
      <div id="charWrap"></div>
      <div id="acryl"></div>
    </div>
    <div id="dialogueArea">
      <div id="dbox">
        <div id="dname"></div>
        <div id="dtext"></div>
        <div id="dnext">▼</div>
      </div>
      <div id="choices"></div>
    </div>
  </div>

  <!-- ========== エンディング画面 ========== -->
  <div id="ending" class="screen">
    <div id="endBadge"></div>
    <div id="endTitle"></div>
    <div id="endFace"></div>
    <div id="endBody"></div>
    <div id="endStats"></div>
    <button class="endBtn" id="retryBtn">同じ友達でもう一度</button>
    <button class="endBtn" id="resetBtn">最初から（顔を作り直す）</button>
  </div>
</div>

/* 顔設定 → SVG文字列 */
function faceSVG(cfg, exprName){
  const skin = SKINS[cfg.skin], hc = HAIRCOLORS[cfg.hairColor];
  const face = FACES[cfg.face], hair = HAIRS[cfg.hair];
  const ex = EXPR[exprName] || {};
  const eyeStyle = ex.eye || EYE_NAMES[cfg.eye][0];
  const browStyle = ex.brow || BROW_NAMES[cfg.brow][0];
  const mouthStyle = ex.mouth || MOUTH_NAMES[cfg.mouth][0];
  const brow = BROWS[browStyle];
  let s = '<svg viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">';
  s += '<style>.mst{stroke:'+INK+';stroke-width:2.4;fill:none;stroke-linecap:round}</style>';
  // 後ろ髪
  if(hair.back) s += hair.back.startsWith('<') ? hair.back.replace('<circle','<circle fill="'+hc+'"')
                                               : '<path d="'+hair.back+'" fill="'+hc+'"/>';
  // 耳・輪郭
  s += '<g fill="'+skin.f+'" stroke="'+skin.s+'" stroke-width="2.5">';
  s += '<circle cx="'+(100-face.rx)+'" cy="130" r="10"/><circle cx="'+(100+face.rx)+'" cy="130" r="10"/>';
  s += face.el.replace('/>',' />');
  s += '</g>';
  // 眉・目
  for(const side of [1,-1]){
    const x = 100 - side*28;
    s += '<g transform="translate('+x+' 100) scale('+side+' 1)"><path d="'+brow.d+'" stroke="'+INK+'" stroke-width="'+brow.w+'" fill="none" stroke-linecap="round"/></g>';
    s += '<g transform="translate('+x+' 116) scale('+side+' 1)">'+EYES[eyeStyle]+'</g>';
  }
  // 鼻・口
  s += NOSES[cfg.nose].el(skin.s);
  s += '<g transform="translate(100 152)">'+MOUTHS[mouthStyle]+'</g>';
  // そのほか・前髪・メガネ・エフェクト
  s += EXTRAS[cfg.extra].el(skin.s);
  if(hair.front) s += '<path d="'+hair.front+'" fill="'+hc+'"/>';
  s += GLASSES[cfg.glasses].el;
  (ex.fx||[]).forEach(f=>{ s += FX[f]; });
  s += '</svg>';
  return s;
}

const dname=$('dname'), dtext=$('dtext'), dnext=$('dnext'), choicesEl=$('choices');
let queue=[], onQueueDone=null, typing=false, typeTimer=null, curFull='';

function setExpr(x){ $('charWrap').innerHTML = faceSVG(cfg, x||'neutral'); }
function setScene(out){
  $('sceneOut').style.opacity = out?1:0;
  $('sceneJail').style.opacity = out?0:1;
  $('acryl').style.opacity = out?0:1;
}
function showMsg(m){
  dnext.style.display='none';
  dtext.classList.toggle('narr', m.who==='sys');
  if(m.who==='sys'){ dname.classList.add('hidden'); }
  else {
    dname.classList.remove('hidden');
    dname.classList.toggle('you', m.who==='you');
    dname.textContent = m.who==='you' ? G.player : G.name;
  }
  if(m.expr) setExpr(m.expr);
  curFull = t(m.text); dtext.textContent=''; typing=true;
  let i=0;
  typeTimer = setInterval(()=>{
    i++; dtext.textContent = curFull.slice(0,i);
    if(i>=curFull.length) finishType();
  }, 30);
}
function finishType(){
  clearInterval(typeTimer); typing=false; dtext.textContent=curFull;
  if(queue.length) dnext.style.display='block';
  else if(onQueueDone){ const f=onQueueDone; onQueueDone=null; setTimeout(f,150); }
}
function advance(){
  if(typing){ finishType(); return; }
  if(queue.length) showMsg(queue.shift());
}
function say(msgs, then){ queue=msgs.slice(); onQueueDone=then||null; advance(); }
$('dbox').addEventListener('click', advance);

function updateHUD(deltas){
  $('phaseLabel').textContent = PHASE_LABEL[G.phase];
  $('turnLabel').textContent = '面会 '+G.turn+' / 10';
  const map = {F:['fillF',G.F], R:['fillR',G.Rf], S:['fillS',G.S]};
  for(const k in map){
    const el = $(map[k][0]);
    el.querySelector('.fill').style.width = map[k][1]+'%';
    el.querySelector('.mval').textContent = map[k][1];
    if(deltas && deltas[k]){
      const c=document.createElement('span');
      c.className='deltaChip '+(deltas[k]>0?'up':'down');
      c.textContent=(deltas[k]>0?'+':'')+deltas[k];
      el.appendChild(c); setTimeout(()=>c.remove(),1500);
    }
  }
}
function applyDelta(d){
  const dd={};
  if(d.F){ dd.F=d.F; G.F=Math.max(0,Math.min(100,G.F+d.F)); }
  if(d.Rf){ dd.R=d.Rf; G.Rf=Math.max(0,Math.min(100,G.Rf+d.Rf)); }
  if(d.S){ dd.S=d.S; G.S=Math.max(0,Math.min(100,G.S+d.S)); }
  updateHUD(dd);
}

function startGame(){
  const name = $('inName').value.trim() || 'タカシ';
  const player = $('inPlayer').value.trim() || 'キミ';
  const crime = $('inCrime').value.trim() || '万引き';
  G = { name, player, crime, i:$('inPronoun').value,
        turn:1, phase:'A', F:60, Rf:15, S:40,
        cnt:{enc:0,sco:0,emp:0,jok:0,tou:0,pra:0}, used:new Set() };
  $('setup').classList.remove('active');
  $('ending').classList.remove('active');
  $('game').classList.add('active');
  choicesEl.innerHTML='';
  setScene(false); setExpr('sad'); updateHUD();
  say([{who:'sys', text:'あなたの友達・{name}が「{crime}」の疑いで捕まってしまった。\n今日は、最初の面会の日──。'}], turnStart);
}

function spiritBucket(){ return G.S<35?'low':(G.S>65?'high':'mid'); }

function turnStart(){
  const prevPhase = G.phase;
  G.phase = PHASES[G.turn];
  updateHUD();
  const msgs=[];
  if(G.phase!==prevPhase){
    const narr = {B:'―― 数日後。{name}の留置場での生活が続いている ――',
                  C:'―― さらに数日後。裁判の日が近づいてきた ――',
                  D:'―― そして、判決の日 ――',
                  E:'―― {name}は釈放された。今日は久しぶりに、外で会う ――'}[G.phase];
    if(narr) msgs.push({who:'sys', text:narr});
    if(G.phase==='E') setScene(true);
  }
  if(G.phase==='D'){
    if(G.Rf>=50) msgs.push({who:'friend', expr:'moved',
      text:'判決、出たよ。反省の気持ちが伝わったみたいで、思ったよりずっと軽く済んだんだ。…{p}のおかげだよ。'});
    else msgs.push({who:'friend', expr:'cry',
      text:'判決…思ったより厳しかった…。「反省の色が見えない」って言われちゃったよ…。'});
  } else {
    const b = spiritBucket();
    msgs.push({who:'friend', expr:pick(OPEN_EXPR[b]), text:pick(OPEN[G.phase][b])});
  }
  say(msgs, showChoices);
}

function pickChoice(tag){
  const pool = (CHOICES[tag].any||[]).concat(CHOICES[tag][G.phase]||[]);
  let cand = pool.filter(c=>!G.used.has(c));
  if(!cand.length){ pool.forEach(c=>G.used.delete(c)); cand=pool; }
  const c = pick(cand); G.used.add(c);
  return {tag, text:c};
}
function showChoices(){
  const list = [ pickChoice('enc'),
                 pickChoice(R(10)<7 ? 'sco' : 'tou'),
                 pickChoice('emp') ];
  if(R(10)<6) list.push(pickChoice(pick(['jok','pra'])));
  // 表示順をシャッフル
  for(let i=list.length-1;i>0;i--){ const j=R(i+1); [list[i],list[j]]=[list[j],list[i]]; }
  choicesEl.innerHTML='';
  list.forEach((c,idx)=>{
    const b=document.createElement('button');
    b.className='choiceBtn'; b.style.animationDelay=(idx*0.08)+'s';
    b.innerHTML='<b>'+TAG_ICON[c.tag]+'</b>'+t(c.text);
    b.addEventListener('click',()=>choose(c));
    choicesEl.appendChild(b);
  });
}

function choose(c){
  choicesEl.innerHTML='';
  G.cnt[c.tag]++;
  const r = react(c.tag);
  say([{who:'you', text:c.text}], ()=>{
    applyDelta(r.d);
    say([{who:'friend', expr:r.x, text:r.t}], ()=>{
      // 即バッドエンド判定
      if(G.F<=5) return showEnding('zetsuen');
      if(G.S<=3) return showEnding('kokoro');
      if(G.turn>=10) return showEnding(judgeEnding());
      G.turn++;
      turnStart();
    });
  });
}

function judgeEnding(){
  const {F,Rf,S} = G;
  if(Rf>=60 && F>=65 && S>=55) return 'shin';
  if(Rf>=60 && F>=50) return 'kousei';
  if(Rf>=60) return 'tooku';
  if(Rf<30 && F<50) return 'saihan';
  if(Rf<40 && F>=60) return 'amayakashi';
  return 'futsu';
}
function showEnding(key){
  const e = ENDINGS[key];
  $('game').classList.remove('active');
  $('ending').classList.add('active');
  $('endBadge').textContent = e.badge + '　RANK ' + e.rank;
  $('endTitle').textContent = e.title;
  $('endFace').innerHTML = faceSVG(cfg, e.expr);
  $('endBody').textContent = t(e.body);
  $('endStats').innerHTML = '<span>💗 友情 '+G.F+'</span><span>🌱 反省 '+G.Rf+'</span><span>☀️ 元気 '+G.S+'</span>';
  window.scrollTo(0,0);
}
